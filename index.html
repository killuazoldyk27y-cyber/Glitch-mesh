<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Glitch Mesh | Secure P2P Communication</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e14;color:#e0e8f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow:hidden}
        .container{max-width:600px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
        .header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1a2a3a;background:#0d1117;flex-shrink:0}
        .back-btn{background:transparent;border:1px solid #00e5ff;border-radius:14px;padding:4px 10px;cursor:pointer;font-size:0.7rem;color:#00e5ff;min-height:32px;display:none}
        .header-title{font-size:1rem;font-weight:700;color:#00e5ff;flex:1;text-align:center;letter-spacing:1px}
        .header-btns{display:flex;gap:4px;align-items:center}
        .btn-id{background:#00e5ff;color:#0a0e14;border:none;border-radius:12px;padding:4px 8px;font-size:0.5rem;font-weight:700;cursor:pointer}
        .status-badge{background:#1a0a14;border:1px solid #ff3366;border-radius:14px;padding:4px 10px;font-size:0.5rem;color:#ff3366;letter-spacing:0.5px}
        .status-badge.online{background:#0a1a14;border-color:#00e5ff;color:#00e5ff}
        .network-bar{background:#0d1117;padding:6px 12px;border-bottom:1px solid #1a2a3a;display:flex;justify-content:space-between;align-items:center;font-size:0.5rem;color:#7a8a9a;flex-shrink:0}
        .network-bar .peers{color:#00e5ff;font-weight:700}
        .screen{flex:1;overflow-y:auto;padding:12px;display:none;min-height:0}
        .screen.active{display:flex;flex-direction:column}
        #contactsScreen.active{display:block}
        .search-bar{display:flex;gap:6px;padding:6px;background:#0d1117;border-bottom:1px solid #1a2a3a;margin:-12px -12px 10px;flex-shrink:0}
        .search-input{flex:1;background:#111822;border:1px solid #1a2a3a;border-radius:18px;padding:8px 14px;color:#e0e8f0;font-size:0.7rem;outline:none;width:100%}
        .btn-add{background:#00e5ff;color:#0a0e14;border:none;border-radius:18px;padding:8px 12px;font-size:0.6rem;font-weight:700;cursor:pointer;flex-shrink:0}
        #contactList{flex:1;overflow-y:auto}
        .contact-item{display:flex;align-items:center;gap:12px;padding:14px;background:#111822;border:1px solid #1a2a3a;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;width:100%}
        .contact-item:active{border-color:#00e5ff}
        .online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
        .online-dot.online{background:#00e5ff}
        .online-dot.offline{background:#556677}
        .avatar{width:44px;height:44px;border-radius:50%;background:#00e5ff;display:flex;align-items:center;justify-content:center;color:#0a0e14;font-weight:700;font-size:18px;flex-shrink:0}
        .contact-info{flex:1;min-width:0}
        .contact-name{font-size:0.85rem;font-weight:700;color:#e0e8f0}
        .contact-preview{font-size:0.65rem;color:#7a8a9a;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .contact-time{font-size:0.55rem;color:#556677;flex-shrink:0}
        .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#00e5ff;color:#0a0e14;border:none;font-size:24px;cursor:pointer;font-weight:700;box-shadow:0 4px 20px rgba(0,229,255,0.3);z-index:100;display:none}
        .fab.show{display:block}
        .chat-area{flex:1;overflow-y:auto;padding:12px 12px 80px 12px;min-height:0;overflow-x:hidden;-webkit-overflow-scrolling:touch}
        .msg-row{display:flex;margin-bottom:10px}
        .msg-row.sent{justify-content:flex-end}
        .msg-row.received{justify-content:flex-start}
        .msg-row.broadcast{justify-content:center}
        .bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:0.75rem;line-height:1.5;word-wrap:break-word}
        .sent .bubble{background:#00e5ff;color:#0a0e14;border-bottom-right-radius:4px}
        .received .bubble{background:#111822;color:#e0e8f0;border-bottom-left-radius:4px;border:1px solid #1a2a3a}
        .broadcast .bubble{background:#1a2a2a;color:#ffaa44;border:1px dashed #ffaa44}
        .msg-time{font-size:0.45rem;text-align:right;margin-top:3px;opacity:0.7}
        .msg-sender{font-size:0.5rem;color:#7a8a9a;margin-bottom:2px}
        .msg-file{font-size:0.7rem;color:#00e5ff;cursor:pointer;text-decoration:underline;margin:5px 0}
        .msg-voice{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,229,255,0.1);border-radius:8px;margin:5px 0}
        .voice-play-btn{background:#00e5ff;color:#0a0e14;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:12px;flex-shrink:0}
        .voice-duration{font-size:0.6rem;color:#7a8a9a}
        .message-bar-container{display:flex;align-items:center;width:100%;padding:8px 10px;box-sizing:border-box;background-color:#0d1117;border-top:1px solid #1a2a3a;flex-shrink:0;position:relative;gap:6px;z-index:100;margin-top:auto}
        .message-input-pill{flex:1;display:flex;align-items:center;background-color:#111822;border:1px solid #1a2a3a;border-radius:50px;padding:4px 8px;height:40px;box-sizing:border-box;min-width:0;overflow:hidden}
        .message-input-pill:focus-within{border-color:#00e5ff}
        .icon-wrapper{display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7a8a9a;flex-shrink:0;padding:4px}
        .icon-wrapper:active{color:#00e5ff}
        .message-input{flex:1;background:transparent;border:none;outline:none;color:#ffffff;font-size:14px;padding:0 6px;min-width:0;width:100%;caret-color:#00e5ff}
        .message-input::placeholder{color:#556677;font-weight:400}
        .action-button{width:40px;height:40px;border-radius:50%;background-color:#00e5ff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0e14;flex-shrink:0;position:relative;border:none;margin:0}
        .action-button .mic-icon{display:flex;align-items:center;justify-content:center}
        .action-button .send-icon{display:none;align-items:center;justify-content:center}
        .action-button.active .mic-icon{display:none}
        .action-button.active .send-icon{display:flex}
        .attach-menu{position:absolute;bottom:60px;left:8px;background:#111822;border:1px solid #00e5ff;border-radius:12px;padding:8px;display:none;z-index:1000;min-width:150px}
        .attach-menu.show{display:block}
        .attach-option{display:flex;align-items:center;gap:8px;padding:10px 12px;background:transparent;border:none;color:#e0e8f0;cursor:pointer;font-size:0.7rem;width:100%;border-radius:8px;text-align:left}
        .attach-option:active{background:#1a2a3a}
        .btn-sm{padding:4px 8px;font-size:0.55rem;border-radius:6px;border:none;cursor:pointer;font-weight:600;flex-shrink:0}
        .btn-clear{background:#ffaa44;color:#000}
        .btn-delete{background:#ff3366;color:#fff}
        .btn-call{background:#00e5ff;color:#000;min-width:32px}
        .btn-video{background:#ffaa44;color:#000;min-width:32px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center;padding:16px}
        .modal.show{display:flex}
        .modal-box{background:#111822;border:1px solid #00e5ff;border-radius:16px;padding:22px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;position:relative}
        .modal-box h3{font-size:0.8rem;color:#00e5ff;margin-bottom:14px;letter-spacing:1px;text-align:center}
        .modal-box input{width:100%;padding:10px;background:#0a0e14;border:1px solid #1a2a3a;border-radius:8px;color:#e0e8f0;font-size:0.7rem;margin-bottom:8px;outline:none;text-transform:uppercase}
        .btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:0.7rem;font-weight:700;text-transform:uppercase;cursor:pointer;margin-bottom:6px;min-height:40px}
        .btn-primary{background:#00e5ff;color:#0a0e14}
        .btn-secondary{background:#1a2a3a;color:#e0e8f0}
        .btn-danger{background:#ff3366;color:#fff}
        .empty-state{text-align:center;padding:40px 20px;color:#556677;font-size:0.7rem;line-height:2}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2a3a;color:#00e5ff;padding:10px 20px;border-radius:20px;font-size:0.65rem;z-index:2000;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:90%;text-align:center}
        .toast.show{opacity:1}
        .file-label{display:block;background:#0a0e14;border:1px dashed #1a2a3a;border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:0.7rem;color:#7a8a9a;margin-bottom:8px}
        .file-label:active{border-color:#00e5ff}
        .recording-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff3366;color:#fff;padding:20px;border-radius:50%;font-size:2rem;z-index:3000;display:none}
        .chat-header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #1a2a3a;background:#0d1117;flex-shrink:0;min-height:44px;z-index:10}
        .id-display{text-align:center;padding:10px;background:#111822;border:1px dashed #00e5ff;border-radius:12px;margin:10px 0}
        .id-display .id-text{font-size:1.2rem;font-weight:700;color:#00e5ff;letter-spacing:2px}
        .id-display .id-label{font-size:0.55rem;color:#8899aa;margin-top:4px}
        .call-fullscreen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:flex;flex-direction:column}
        .call-fullscreen .remote-video-large{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
        .call-fullscreen .local-video-small{width:120px;height:160px;object-fit:cover;position:absolute;top:20px;right:20px;border-radius:12px;border:2px solid #00e5ff;background:#111;z-index:10}
        .call-fullscreen .call-controls{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:16px}
        .call-fullscreen .call-btn{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .call-fullscreen .call-btn-end{background:#ff3366;color:#fff}
        .call-fullscreen .caller-name{position:absolute;top:60px;left:50%;transform:translateX(-50%);color:#fff;font-size:1.1rem;font-weight:700;z-index:10;text-align:center}
        .call-fullscreen .call-status{position:absolute;top:90px;left:50%;transform:translateX(-50%);color:#8899aa;font-size:0.7rem;z-index:10}
        .call-fullscreen .call-timer{position:absolute;top:115px;left:50%;transform:translateX(-50%);color:#00e5ff;font-size:1.2rem;font-weight:700;z-index:10}
        .call-fullscreen .audio-only-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:5;color:#00e5ff}
    </style>
</head>
<body>
<div class="container" id="appContainer">
    <div class="header" id="globalHeader">
        <button class="back-btn" id="headerBackBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="header-title" id="headerTitle">◆ GLITCH MESH ◆</div>
        <div class="header-btns">
            <button class="btn-id" id="shareIdBtn">My ID</button>
            <span class="status-badge" id="statusBadge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff3366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="2" x2="22" y2="22"/></svg> OFFLINE</span>
        </div>
    </div>
    <div class="network-bar" id="networkBar">
        <span id="networkStatus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff3366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="2" x2="22" y2="22"/></svg> Offline</span>
        <span>◉ <span class="peers" id="peerCount">0</span> peers</span>
    </div>
    <div class="screen active" id="contactsScreen">
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="◇ Search contacts..." oninput="filterContacts()">
            <button class="btn-add" id="addContactBtn">+ Add</button>
        </div>
        <div id="contactList"></div>
    </div>
    <div class="screen" id="chatScreen">
        <div class="chat-header">
            <button class="back-btn" id="chatBackBtn" style="display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
            <span id="chatTitle" style="font-size:0.8rem;font-weight:600;flex:1;">◇ Chat</span>
            <button class="btn-sm btn-call" id="voiceCallBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
            <button class="btn-sm btn-video" id="videoCallBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
            <button class="btn-sm btn-clear" id="clearChatBtn">Clear chat</button>
            <button class="btn-sm btn-delete" id="deleteContactBtn">Del contact</button>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="message-bar-container">
            <div class="message-input-pill">
                <div class="icon-wrapper" id="emojiBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></div>
                <input type="text" id="chatInput" class="message-input" placeholder="Message" autocomplete="off">
                <div class="icon-wrapper" id="attachBtn" style="margin-right:2px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></div>
            </div>
            <button class="action-button" id="actionButton">
                <span class="mic-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></span>
                <span class="send-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></span>
            </button>
            <div class="attach-menu" id="attachMenu">
                <button class="attach-option" id="fileOption"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Send File</button>
                <button class="attach-option" id="voiceOption"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>Voice Message</button>
                <button class="attach-option" id="broadcastOption"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-2V6h2v2zm0 4h-2v-2h2v2zm0 4h-2v-2h2v2zm2-8h2v2h-2V8zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zM2 10v4h4l5 5V5L6 10H2z"/></svg>Broadcast</button>
            </div>
        </div>
    </div>
    <div class="modal" id="setupModal">
        <div class="modal-box">
            <h3>◆ Connect to Mesh</h3>
            <input type="text" id="serverIpInput" placeholder="Server IP (e.g., 192.168.43.1)">
            <input type="text" id="peerNameInput" placeholder="Your Name">
            <button class="btn btn-primary" id="connectBtn">◇ Connect</button>
            <button class="btn btn-secondary" onclick="closeModal('setupModal')">✕ Close</button>
        </div>
    </div>
    <div class="modal" id="shareIdModal">
        <div class="modal-box">
            <h3>◆ Your Glitch ID</h3>
            <div class="id-display">
                <div class="id-text" id="displayGlitchId"></div>
                <div class="id-label">Share this ID with others to connect</div>
            </div>
            <button class="btn btn-primary" id="copyIdBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy Id</button>
            <button class="btn btn-secondary" onclick="closeModal('shareIdModal')">✕ Close</button>
        </div>
    </div>
    <div class="modal" id="addContactModal">
        <div class="modal-box">
            <h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Add Contact by ID</h3>
            <input type="text" id="contactGlitchIdInput" placeholder="Enter Glitch ID (GM-XXXX-XXXX)" maxlength="12">
            <input type="text" id="contactNameInput" placeholder="Contact Name" style="text-transform:none;">
            <button class="btn btn-primary" id="saveContactBtn">✓ Save Contact</button>
            <button class="btn btn-secondary" onclick="closeModal('addContactModal')">✕ Cancel</button>
        </div>
    </div>
    <div class="modal" id="fileModal">
        <div class="modal-box">
            <h3>◆ Send File</h3>
            <input type="file" id="fileInput" style="display:none;">
            <label class="file-label" for="fileInput" id="fileLabel"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> tap to select any file (up to 1GB)</label>
            <button class="btn btn-primary" id="fileSendBtn">✓ Send File</button>
            <button class="btn btn-secondary" onclick="closeModal('fileModal')">✕ Cancel</button>
        </div>
    </div>
    <div class="modal" id="callModal">
        <div class="modal-box" style="text-align:center;">
            <h3 id="callModalTitle"><svg width="22" height="22" viewBox="0 0 24 24" fill="#00e5ff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg> Incoming Call</h3>
            <div id="callerName" style="font-size:1rem;color:#00e5ff;margin:10px 0;"></div>

var App={name:'User-'+Math.floor(Math.random()*1000),peerId:permanentPeerId,glitchId:null,contacts:[],messages:[],activeContactId:null,ws:null,isConnected:false,serverIp:'',mediaRecorder:null,audioChunks:[],isRecording:false,audioType:'audio/webm'};

var CallTones={audioContext:null,interval:null,
playOutgoing:function(){try{CallTones.audioContext=new(window.AudioContext||window.webkitAudioContext)();function tone(){var ctx=CallTones.audioContext;var o1=ctx.createOscillator();var o2=ctx.createOscillator();var g=ctx.createGain();o1.frequency.value=480;o2.frequency.value=620;o1.type='sine';o2.type='sine';g.gain.value=0.2;o1.connect(g);o2.connect(g);g.connect(ctx.destination);o1.start();o2.start();setTimeout(function(){o1.stop();o2.stop();},400);}tone();CallTones.interval=setInterval(tone,3000);}catch(e){}},

var CallSystem={localStream:null,peerConnection:null,isInCall:false,currentCallType:null,pendingOffer:null,configuration:{iceServers:[]},callTimer:null,callSeconds:0,
startCall:function(type){var contact=App.contacts.find(function(c){return c.id===App.activeContactId;});if(!contact||!contact.peerId){toast('Contact offline');return;}CallSystem.currentCallType=type;var constraints=type==='video'?{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:640,height:480,frameRate:30}}:{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};navigator.mediaDevices.getUserMedia(constraints).then(function(stream){CallSystem.localStream=stream;var modal=document.getElementById('activeCallModal');modal.innerHTML='<div class="call-fullscreen">'+(type==='video'?'<video id="remoteVideoBig" class="remote-video-large" autoplay playsinline></video>':'<div class="audio-only-icon"><svg width="80" height="80" viewBox="0 0 24 24" fill="#00e5ff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div><audio id="remoteAudioBig" autoplay></audio>')+(type==='video'?'<video id="localVideoBig" class="local-video-small" autoplay muted playsinline></video>':'')+'<div class="caller-name">'+contact.name+'</div><div class="call-status" id="callStatus">Calling...</div><div class="call-timer" id="callTimer">00:00</div><div class="call-controls"><button class="call-btn call-btn-end" onclick="CallSystem.endCallAndNotify()"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/></svg></button></div></div>';modal.classList.add('show');if(type==='video'){document.getElementById('localVideoBig').srcObject=stream;document.getElementById('localVideoBig').muted=true;}CallSystem.peerConnection=new RTCPeerConnection(CallSystem.configuration);stream.getTracks().forEach(function(track){CallSystem.peerConnection.addTrack(track,stream);});CallSystem.peerConnection.onicecandidate=function(e){if(e.candidate){App.ws.send(JSON.stringify({type:'call_ice',targetPeerId:contact.peerId,ice:e.candidate}));}};CallSystem.peerConnection.ontrack=function(e){var rv=document.getElementById('remoteVideoBig');if(rv){rv.srcObject=e.streams[0];rv.muted=false;rv.autoplay=true;rv.playsInline=true;rv.play().catch(function(){});}else{var ra=document.getElementById('remoteAudioBig');if(ra){ra.srcObject=e.streams[0];ra.muted=false;ra.autoplay=true;ra.play().catch(function(){});}}var st=document.getElementById('callStatus');if(st){st.textContent='Connected';}CallSystem.startTimer();};CallSystem.peerConnection.createOffer().then(function(offer){return CallSystem.peerConnection.setLocalDescription(offer);}).then(function(){App.ws.send(JSON.stringify({type:'call_offer',targetPeerId:contact.peerId,offer:CallSystem.peerConnection.localDescription}));}).catch(function(){toast('Call failed');});CallSystem.isInCall=true;CallTones.playOutgoing();toast('Calling...');}).catch(function(){toast('Mic/Camera denied. Use HTTPS!');});},
acceptCall:function(){CallTones.stop();var constraints=CallSystem.currentCallType==='video'?{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:640,height:480,frameRate:30}}:{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};navigator.mediaDevices.getUserMedia(constraints).then(function(stream){CallSystem.localStream=stream;document.getElementById('callModal').classList.remove('show');var modal=document.getElementById('activeCallModal');modal.innerHTML='<div class="call-fullscreen">'+(CallSystem.currentCallType==='video'?'<video id="remoteVideoBig" class="remote-video-large" autoplay playsinline></video>':'<div class="audio-only-icon"><svg width="80" height="80" viewBox="0 0 24 24" fill="#00e5ff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div><audio id="remoteAudioBig" autoplay></audio>')+(CallSystem.currentCallType==='video'?'<video id="localVideoBig" class="local-video-small" autoplay muted playsinline></video>':'')+'<div class="caller-name">'+CallSystem.pendingOffer.fromName+'</div><div class="call-status">Connected</div><div class="call-timer" id="callTimer">00:00</div><div class="call-controls"><button class="call-btn call-btn-end" onclick="CallSystem.endCallAndNotify()"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/></svg></button></div></div>';modal.classList.add('show');if(CallSystem.currentCallType==='video'){document.getElementById('localVideoBig').srcObject=stream;document.getElementById('localVideoBig').muted=true;}CallSystem.peerConnection=new RTCPeerConnection(CallSystem.configuration);stream.getTracks().forEach(function(track){CallSystem.peerConnection.addTrack(track,stream);});CallSystem.peerConnection.onicecandidate=function(e){if(e.candidate){App.ws.send(JSON.stringify({type:'call_ice',targetPeerId:CallSystem.pendingOffer.from,ice:e.candidate}));}};CallSystem.peerConnection.ontrack=function(e){var rv=document.getElementById('remoteVideoBig');if(rv){rv.srcObject=e.streams[0];rv.muted=false;rv.autoplay=true;rv.playsInline=true;rv.play().catch(function(){});}else{var ra=document.getElementById('remoteAudioBig');if(ra){ra.srcObject=e.streams[0];ra.muted=false;ra.autoplay=true;ra.play().catch(function(){});}}CallSystem.startTimer();};CallSystem.peerConnection.setRemoteDescription(new RTCSessionDescription(CallSystem.pendingOffer.offer)).then(function(){return CallSystem.peerConnection.createAnswer();}).then(function(answer){return CallSystem.peerConnection.setLocalDescription(answer);}).then(function(){App.ws.send(JSON.stringify({type:'call_answer',targetPeerId:CallSystem.pendingOffer.from,answer:CallSystem.peerConnection.localDescription}));}).catch(function(){toast('Call failed');});CallSystem.isInCall=true;}).catch(function(){toast('Mic/Camera denied. Use HTTPS!');});},
startTimer:function(){CallSystem.callSeconds=0;CallSystem.callTimer=setInterval(function(){CallSystem.callSeconds++;var m=Math.floor(CallSystem.callSeconds/60);var s=CallSystem.callSeconds%60;var el=document.getElementById('callTimer');if(el){el.textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);}},1000);},
stopTimer:function(){if(CallSystem.callTimer){clearInterval(CallSystem.callTimer);CallSystem.callTimer=null;}},
endCallAndNotify:function(){var targetPeerId=null;if(CallSystem.pendingOffer){targetPeerId=CallSystem.pendingOffer.from;}else{var contact=App.contacts.find(function(c){return c.id===App.activeContactId;});if(contact){targetPeerId=contact.peerId;}}if(targetPeerId&&App.ws){App.ws.send(JSON.stringify({type:'call_end',targetPeerId:targetPeerId}));}CallSystem.endCall();},
endCall:function(){CallTones.stop();CallSystem.stopTimer();if(CallSystem.localStream){CallSystem.localStream.getTracks().forEach(function(track){track.stop();});}if(CallSystem.peerConnection){CallSystem.peerConnection.close();}CallSystem.localStream=null;CallSystem.peerConnection=null;CallSystem.isInCall=false;CallSystem.currentCallType=null;CallSystem.pendingOffer=null;document.getElementById('activeCallModal').classList.remove('show');document.getElementById('activeCallModal').innerHTML='';document.getElementById('callModal').classList.remove('show');toast('Ended');}};

var FileTransfer={chunkSize:1024*1024,activeTransfers:{},sendLargeFile:function(file,contact){var self=this;var transferId='ft_'+Date.now();var totalChunks=Math.ceil(file.size/this.chunkSize);toast('Sending (0%)');App.ws.send(JSON.stringify({type:'file_start',transferId:transferId,targetPeerId:contact.peerId,fileName:file.name,fileType:file.type,fileSize:file.size,totalChunks:totalChunks,timestamp:Date.now()}));var currentChunk=0;var offset=0;function sendNextChunk(){if(currentChunk>=totalChunks){toast('File sent');var blobUrl=URL.createObjectURL(file);var msgId=App.messages.length+1;App.messages.push({id:msgId,contactId:contact.id,fileName:file.name,fileType:file.type,fileSize:file.size,blobUrl:blobUrl,type:'sent',time:getTime(),largeFile:true,fileStored:true});FileDB.saveFile(msgId,file).then(function(){console.log('Sent file saved to IndexedDB');}).catch(function(e){console.error('Failed to save sent file:',e);});saveData();renderChat();closeModal('fileModal');return;}var chunk=file.slice(offset,offset+self.chunkSize);var reader=new FileReader();reader.onload=function(e){var chunkData=e.target.result.split(',')[1];App.ws.send(JSON.stringify({type:'file_chunk',transferId:transferId,targetPeerId:contact.peerId,chunkIndex:currentChunk,totalChunks:totalChunks,data:chunkData,timestamp:Date.now()}));currentChunk++;offset+=self.chunkSize;var progress=Math.round((currentChunk/totalChunks)*100);if(progress%10===0){toast(progress+'%');}setTimeout(sendNextChunk,50);};reader.readAsDataURL(chunk);}sendNextChunk();},receiveChunk:function(data){var transferId=data.transferId;if(!this.activeTransfers[transferId]){this.activeTransfers[transferId]={chunks:[],totalChunks:data.totalChunks,fileName:data.fileName,fileType:data.fileType,fileSize:data.fileSize,from:data.from,fromName:data.fromName,fromGlitchId:data.fromGlitchId,received:0};}var transfer=this.activeTransfers[transferId];transfer.chunks[data.chunkIndex]=data.data;transfer.received++;var progress=Math.round((transfer.received/transfer.totalChunks)*100);if(transfer.received===transfer.totalChunks){this.reassembleFile(transferId);}else if(progress%10===0){toast(progress+'%');}},reassembleFile:function(transferId){var transfer=this.activeTransfers[transferId];var sender=App.contacts.find(function(c){return c.glitchId===transfer.fromGlitchId;});if(!sender){delete this.activeTransfers[transferId];return;}if(transfer.fileSize<1024*1024){var fullBase64='';for(var i=0;i<transfer.totalChunks;i++){if(transfer.chunks[i]){fullBase64+=transfer.chunks[i];}}App.messages.push({id:App.messages.length+1,contactId:sender.id,fileName:transfer.fileName,fileType:transfer.fileType,fileSize:transfer.fileSize,fileData:fullBase64,type:'received',time:getTime(),sender:transfer.fromName,fromGlitchId:transfer.fromGlitchId});saveData();renderChat();renderContacts();toast('File received');}else{try{var chunks=[];for(var j=0;j<transfer.totalChunks;j++){if(transfer.chunks[j]){var bin=atob(transfer.chunks[j]);var bytes=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++){bytes[k]=bin.charCodeAt(k);}chunks.push(bytes);}}var blob=new Blob(chunks,{type:transfer.fileType||'application/octet-stream'});var blobUrl=URL.createObjectURL(blob);var msgId=App.messages.length+1;App.messages.push({id:msgId,contactId:sender.id,fileName:transfer.fileName,fileType:transfer.fileType,fileSize:transfer.fileSize,blobUrl:blobUrl,type:'received',time:getTime(),sender:transfer.fromName,fromGlitchId:transfer.fromGlitchId,largeFile:true,fileStored:true});FileDB.saveFile(msgId,blob).then(function(){console.log('File saved to IndexedDB');}).catch(function(e){console.error('Failed to save to IndexedDB:',e);});saveData();renderChat();renderContacts();toast('File received - Tap to download');}catch(e){console.error('Blob creation error:',e);var fullBase64='';for(var m=0;m<transfer.totalChunks;m++){if(transfer.chunks[m]){fullBase64+=transfer.chunks[m];}}App.messages.push({id:App.messages.length+1,contactId:sender.id,fileName:transfer.fileName,fileType:transfer.fileType,fileSize:transfer.fileSize,fileData:fullBase64,type:'received',time:getTime(),sender:transfer.fromName,fromGlitchId:transfer.fromGlitchId,largeFile:true});saveData();renderChat();renderContacts();toast('File received');}}transfer.chunks=null;delete this.activeTransfers[transferId];}};

function toast(m){var t=document.getElementById('toastMsg');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show');},3000);}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function openModal(id){document.getElementById(id).classList.add('show');}
function getTime(){var d=new Date();return(d.getHours()<10?'0'+d.getHours():d.getHours())+':'+(d.getMinutes()<10?'0'+d.getMinutes():d.getMinutes());}
function saveData(){try{var messagesToSave=App.messages.map(function(msg){if(msg.blobUrl){var cleanMsg=Object.assign({},msg);cleanMsg.blobUrl=null;return cleanMsg;}return msg;});localStorage.setItem('glitchMesh',JSON.stringify({contacts:App.contacts,messages:messagesToSave,name:App.name,peerId:App.peerId,glitchId:App.glitchId}));}catch(e){toast('Storage full - removing old files');try{App.messages=App.messages.filter(function(msg){return !msg.largeFile;}).slice(-50);localStorage.setItem('glitchMesh',JSON.stringify({contacts:App.contacts,messages:App.messages,name:App.name,peerId:App.peerId,glitchId:App.glitchId}));}catch(e2){toast('Cannot save data');}}}
function loadData(){try{var d=JSON.parse(localStorage.getItem('glitchMesh'));if(d){App.contacts=d.contacts||[];App.messages=d.messages||[];App.name=d.name||'User-'+Math.floor(Math.random()*1000);App.peerId=permanentPeerId;App.glitchId=d.glitchId||localStorage.getItem('glitchId');}}catch(e){App.peerId=permanentPeerId;}}
function restoreBlobUrls(){if(!FileDB.db){setTimeout(restoreBlobUrls,500);return;}App.messages.forEach(function(msg){if(msg.largeFile&&msg.fileStored&&!msg.blobUrl){FileDB.getFile(msg.id).then(function(result){if(result&&result.blob){msg.blobUrl=URL.createObjectURL(result.blob);saveData();renderChat();}}).catch(function(e){console.error('Failed to restore blob:',e);});}});}
var FileDB={db:null,init:function(){return new Promise(function(resolve,reject){var request=indexedDB.open('GlitchMeshFiles',1);request.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('files')){db.createObjectStore('files',{keyPath:'id'});}};request.onsuccess=function(e){FileDB.db=e.target.result;resolve();};request.onerror=function(e){console.error('IndexedDB error:',e);reject(e);};});},saveFile:function(id,blob){return new Promise(function(resolve,reject){if(!FileDB.db){reject('DB not initialized');return;}try{var tx=FileDB.db.transaction(['files'],'readwrite');tx.objectStore('files').put({id:id,blob:blob});tx.oncomplete=function(){resolve();};tx.onerror=function(e){reject(e);};}catch(e){reject(e);}});},getFile:function(id){return new Promise(function(resolve,reject){if(!FileDB.db){reject('DB not initialized');return;}try{var tx=FileDB.db.transaction(['files'],'readonly');var request=tx.objectStore('files').get(id);request.onsuccess=function(){resolve(request.result);};request.onerror=function(e){reject(e);};}catch(e){reject(e);}});},deleteFile:function(id){return new Promise(function(resolve,reject){if(!FileDB.db){reject('DB not initialized');return;}try{var tx=FileDB.db.transaction(['files'],'readwrite');tx.objectStore('files').delete(id);tx.oncomplete=function(){resolve();};tx.onerror=function(e){reject(e);};}catch(e){reject(e);}});}};

function connectToMesh(ip){App.serverIp=ip;var url=(location.protocol==='https:'?'wss://':'ws://')+ip+':8080';toast('Connecting...');try{App.ws=new WebSocket(url);App.ws.onopen=function(){App.isConnected=true;toast('Connected');updateUI();App.ws.send(JSON.stringify({type:'register',peerId:App.peerId,name:App.name,glitchId:App.glitchId}));};App.ws.onmessage=function(event){try{var data=JSON.parse(event.data);handleMessage(data);}catch(e){}};App.ws.onclose=function(){App.isConnected=false;toast('Disconnected');updateUI();};App.ws.onerror=function(){toast('Connection error');};closeModal('setupModal');}catch(e){toast('Failed to connect');}}

function handleMessage(data){
switch(data.type){
case 'id_conflict':App.glitchId=data.newGlitchId;localStorage.setItem('glitchId',App.glitchId);saveData();updateUI();toast('New ID: '+App.glitchId);break;
case 'peer_list':data.peers.forEach(function(peer){if(peer.peerId!==App.peerId){var c=App.contacts.find(function(x){return x.glitchId===peer.glitchId;});if(c){c.peerId=peer.peerId;c.isOnline=true;c.name=peer.name||c.name;}}});saveData();renderContacts();updateUI();toast(data.peers.length+' peers online');break;
case 'peer_joined':if(data.peerId!==App.peerId){var c=App.contacts.find(function(x){return x.glitchId===data.glitchId;});if(c){c.peerId=data.peerId;c.isOnline=true;}saveData();renderContacts();updateUI();}break;
case 'peer_left':var c=App.contacts.find(function(x){return x.glitchId===data.glitchId;});if(c){c.isOnline=false;c.peerId=null;renderContacts();updateUI();}break;
case 'call_offer':CallSystem.pendingOffer=data;CallSystem.currentCallType=data.offer&&data.offer.sdp&&data.offer.sdp.indexOf('video')>=0?'video':'voice';document.getElementById('callModalTitle').textContent=CallSystem.currentCallType==='video'?'Incoming Video Call':'Incoming Voice Call';document.getElementById('callerName').textContent=data.fromName+' ('+data.fromGlitchId+')';openModal('callModal');CallTones.playIncoming();break;
case 'call_answer':CallTones.stop();if(CallSystem.peerConnection){CallSystem.peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));}break;
case 'call_ice':if(CallSystem.peerConnection&&data.ice){try{var iceCandidate=new RTCIceCandidate(data.ice);CallSystem.peerConnection.addIceCandidate(iceCandidate).catch(function(){});}catch(e){try{var ice2=new RTCIceCandidate({candidate:data.ice.candidate,sdpMid:data.ice.sdpMid,sdpMLineIndex:data.ice.sdpMLineIndex});CallSystem.peerConnection.addIceCandidate(ice2).catch(function(){});}catch(e2){}}}break;
case 'call_reject':CallTones.stop();CallSystem.endCall();toast('Call rejected');break;
case 'call_end':CallTones.stop();CallSystem.endCall();toast('Call ended');break;
case 'message':var s=App.contacts.find(function(x){return x.glitchId===data.fromGlitchId;});if(s){s.peerId=data.from;App.messages.push({id:App.messages.length+1,contactId:s.id,text:data.encrypted||data.text,type:'received',time:getTime(),sender:data.fromName,fromGlitchId:data.fromGlitchId});saveData();renderChat();renderContacts();toast('From: '+data.fromName);}break;
case 'file':var s=App.contacts.find(function(x){return x.glitchId===data.fromGlitchId;});if(s){s.peerId=data.from;App.messages.push({id:App.messages.length+1,contactId:s.id,fileName:data.fileName,fileType:data.fileType,fileSize:data.fileSize,fileData:data.fileData,type:'received',time:getTime(),sender:data.fromName,fromGlitchId:data.fromGlitchId});saveData();renderChat();renderContacts();toast('File received');}break;
case 'file_start':FileTransfer.activeTransfers[data.transferId]={chunks:[],totalChunks:data.totalChunks,fileName:data.fileName,fileType:data.fileType,fileSize:data.fileSize,from:data.from,fromName:data.fromName,fromGlitchId:data.fromGlitchId,received:0};toast('Receiving...');break;
case 'file_chunk':FileTransfer.receiveChunk(data);break;
case 'voice':var s=App.contacts.find(function(x){return x.glitchId===data.fromGlitchId;});if(s){s.peerId=data.from;App.messages.push({id:App.messages.length+1,contactId:s.id,voiceData:data.voiceData,voiceDuration:data.duration,audioType:data.audioType||'audio/webm',type:'received',time:getTime(),sender:data.fromName,fromGlitchId:data.fromGlitchId});saveData();renderChat();renderContacts();toast('Voice from '+data.fromName);}break;
case 'broadcast':App.contacts.forEach(function(c){if(c.peerId!==data.from){App.messages.push({id:App.messages.length+1,contactId:c.id,text:data.text+' (from '+data.fromName+')',type:'broadcast',time:getTime(),sender:data.fromName,fromGlitchId:data.fromGlitchId});}});saveData();renderChat();renderContacts();toast('Broadcast');break;
case 'error':toast(data.message);break;
}}

function sendMessage(){var inp=document.getElementById('chatInput');var text=inp.value.trim();if(!text)return;inp.value='';updateActionButton();var c=App.contacts.find(function(x){return x.id===App.activeContactId;});if(!c||!c.peerId){toast('Contact offline');return;}if(!App.ws||App.ws.readyState!==WebSocket.OPEN){toast('Not connected');return;}App.ws.send(JSON.stringify({type:'message',targetPeerId:c.peerId,encrypted:text,timestamp:Date.now()}));App.messages.push({id:App.messages.length+1,contactId:c.id,text:text,type:'sent',time:getTime()});saveData();renderChat();renderContacts();toast('Sent');}

function sendFile(){var inp=document.getElementById('fileInput');var f=inp.files[0];if(!f){toast('Select file');return;}var c=App.contacts.find(function(x){return x.id===App.activeContactId;});if(!c||!c.peerId){toast('Contact offline');return;}if(!App.ws||App.ws.readyState!==WebSocket.OPEN){toast('Not connected');return;}if(f.size>1024*1024*1024){toast('File too large');return;}if(f.size>1024*1024){FileTransfer.sendLargeFile(f,c);}else{var reader=new FileReader();reader.onload=function(e){var base64=e.target.result.split(',')[1];App.ws.send(JSON.stringify({type:'file',targetPeerId:c.peerId,fileName:f.name,fileType:f.type,fileSize:f.size,fileData:base64,timestamp:Date.now()}));App.messages.push({id:App.messages.length+1,contactId:c.id,fileName:f.name,fileType:f.type,fileSize:f.size,fileData:base64,type:'sent',time:getTime()});saveData();renderChat();closeModal('fileModal');toast('File sent');};reader.readAsDataURL(f);}}

function startRecording(){navigator.getUserMedia=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia||navigator.msGetUserMedia;if(!navigator.mediaDevices&&!navigator.getUserMedia){toast('Voice not supported');return;}var successCallback=function(stream){if(typeof MediaRecorder==='undefined'){toast('Recording not supported');return;}var mimeType='';var types=['audio/webm','audio/mp4','audio/ogg','audio/wav','audio/aac'];for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){mimeType=types[i];break;}}var options={};if(mimeType){options={mimeType:mimeType};}try{App.mediaRecorder=new MediaRecorder(stream,options);}catch(e){try{App.mediaRecorder=new MediaRecorder(stream);}catch(e2){toast('Recording failed');return;}}App.audioType=App.mediaRecorder.mimeType||'audio/webm';App.audioChunks=[];App.mediaRecorder.ondataavailable=function(e){if(e.data.size>0){App.audioChunks.push(e.data);}};App.mediaRecorder.onstop=function(){var blob=new Blob(App.audioChunks,{type:App.audioType});var reader=new FileReader();reader.onload=function(e){var base64=e.target.result.split(',')[1];sendVoiceMessage(base64,App.recordingDuration,App.audioType);};reader.readAsDataURL(blob);};App.mediaRecorder.start();App.isRecording=true;App.recordingStartTime=Date.now();document.getElementById('recordingIndicator').style.display='block';toast('Recording...');};var errorCallback=function(err){toast('Mic denied');};if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({audio:true}).then(successCallback).catch(errorCallback);}else if(navigator.getUserMedia){navigator.getUserMedia({audio:true},successCallback,errorCallback);}}

function stopRecording(){if(App.mediaRecorder&&App.isRecording){App.recordingDuration=Math.round((Date.now()-App.recordingStartTime)/1000);App.mediaRecorder.stop();App.isRecording=false;document.getElementById('recordingIndicator').style.display='none';toast('Voice: '+App.recordingDuration+'s');}}

function sendVoiceMessage(data,dur,audioType){var c=App.contacts.find(function(x){return x.id===App.activeContactId;});if(!c||!c.peerId){toast('Contact offline');return;}if(!App.ws||App.ws.readyState!==WebSocket.OPEN){toast('Not connected');return;}App.ws.send(JSON.stringify({type:'voice',targetPeerId:c.peerId,voiceData:data,duration:dur,audioType:audioType||'audio/webm',timestamp:Date.now()}));App.messages.push({id:App.messages.length+1,contactId:c.id,voiceData:data,voiceDuration:dur,audioType:audioType||'audio/webm',type:'sent',time:getTime()});saveData();renderChat();toast('Voice sent');}

function playVoice(data,audioType){var type=audioType||'audio/webm';var a=new Audio('data:'+type+';base64,'+data);a.play().catch(function(){var b=new Audio('data:audio/webm;base64,'+data);b.play();});}
function downloadFile(data,name,type){var bin=atob(data);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var blob=new Blob([bytes],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Downloading: '+name);}
function downloadBlobFile(blobUrl,name){var a=document.createElement('a');a.href=blobUrl;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Downloading: '+name);}
function broadcastMessage(){var text=prompt('Enter broadcast message:');if(!text)return;if(!App.ws||App.ws.readyState!==WebSocket.OPEN){toast('Not connected');return;}App.ws.send(JSON.stringify({type:'broadcast',text:text,timestamp:Date.now()}));toast('Broadcast sent');}
function clearChat(){if(!App.activeContactId)return;if(!confirm('Clear all messages?'))return;var msgsToDelete=App.messages.filter(function(m){return m.contactId===App.activeContactId;});msgsToDelete.forEach(function(m){if(m.largeFile&&m.fileStored){FileDB.deleteFile(m.id).catch(function(e){console.error('Failed to delete file:',e);});}});App.messages=App.messages.filter(function(m){return m.contactId!==App.activeContactId;});saveData();renderChat();toast('Chat cleared');}
function deleteContact(){if(!App.activeContactId)return;var c=App.contacts.find(function(x){return x.id===App.activeContactId;});if(!c)return;if(!confirm('Delete '+c.name+'?'))return;var msgsToDelete=App.messages.filter(function(m){return m.contactId===App.activeContactId;});msgsToDelete.forEach(function(m){if(m.largeFile&&m.fileStored){FileDB.deleteFile(m.id).catch(function(e){console.error('Failed to delete file:',e);});}});App.contacts=App.contacts.filter(function(x){return x.id!==App.activeContactId;});App.messages=App.messages.filter(function(m){return m.contactId!==App.activeContactId;});App.activeContactId=null;saveData();goBackToContacts();toast('Contact deleted');}

function updateUI(){var badge=document.getElementById('statusBadge');var status=document.getElementById('networkStatus');var count=document.getElementById('peerCount');var pc=0;for(var i=0;i<App.contacts.length;i++){if(App.contacts[i].isOnline)pc++;}if(App.isConnected){badge.textContent='ONLINE';badge.className='status-badge online';status.textContent='Connected | ID: '+App.glitchId;count.textContent=pc;}else{badge.textContent='OFFLINE';badge.className='status-badge';status.textContent='Offline | ID: '+App.glitchId;count.textContent='0';}}

function renderContacts(){var container=document.getElementById('contactList');if(!App.contacts.length){container.innerHTML='<div class="empty-state">No contacts<br><span style="font-size:0.55rem;">Your ID: '+App.glitchId+'</span><br><span style="font-size:0.55rem;">Tap "+ Add" to add contact by ID</span></div>';updateUI();return;}var html='';for(var i=0;i<App.contacts.length;i++){var c=App.contacts[i];var lastMsg=null;for(var j=App.messages.length-1;j>=0;j--){if(App.messages[j].contactId===c.id){lastMsg=App.messages[j];break;}}var dot=c.isOnline?'online':'offline';var preview='No messages';if(lastMsg){preview=lastMsg.fileName||lastMsg.text||'Voice message';}html+='<div class="contact-item" onclick="openChat('+c.id+')"><div class="avatar">'+c.name.charAt(0).toUpperCase()+'</div><div class="contact-info"><div class="contact-name">'+c.name+'<span class="online-dot '+dot+'"></span></div><div class="contact-preview">'+preview.slice(0,35)+'</div></div><div class="contact-time">'+(c.glitchId||'')+'</div></div>';}container.innerHTML=html;updateUI();}
function filterContacts(){var q=document.getElementById('searchInput').value.toLowerCase();var items=document.querySelectorAll('.contact-item');for(var i=0;i<items.length;i++){var n=items[i].querySelector('.contact-name');if(n){items[i].style.display=n.textContent.toLowerCase().indexOf(q)>=0?'flex':'none';}}}
function openChat(id){App.activeContactId=id;var c=App.contacts.find(function(x){return x.id===id;});if(!c)return;document.getElementById('contactsScreen').classList.remove('active');document.getElementById('chatScreen').classList.add('active');document.getElementById('headerBackBtn').style.display='flex';document.getElementById('headerTitle').textContent=c.name;document.getElementById('chatTitle').textContent=c.name+(c.glitchId?' | '+c.glitchId:'');document.getElementById('fabBtn').classList.remove('show');renderChat();}
function renderChat(){var area=document.getElementById('chatArea');var msgs=[];for(var i=0;i<App.messages.length;i++){if(App.messages[i].contactId===App.activeContactId)msgs.push(App.messages[i]);}if(!msgs.length){area.innerHTML='<div class="empty-state">No messages yet</div>';return;}var html='';for(var j=0;j<msgs.length;j++){var m=msgs[j];var cls='msg-row ';if(m.type==='sent')cls+='sent';else if(m.type==='broadcast')cls+='broadcast';else cls+='received';var sender='';if(m.type==='broadcast'||(m.type==='received'&&m.sender)){sender='<div class="msg-sender">'+(m.sender||'Unknown')+(m.fromGlitchId?' ('+m.fromGlitchId+')':'')+'</div>';}var content='';if(m.fileName&&m.fileData&&!m.largeFile){content='<div class="msg-file" data-fid="'+m.id+'" style="cursor:pointer;text-decoration:underline;">'+m.fileName+' ('+Math.round(m.fileSize/1024)+' KB)</div>';}else if(m.fileName&&m.largeFile&&m.blobUrl){content='<div class="msg-file" data-blob="'+m.id+'" style="color:#00e5ff;cursor:pointer;text-decoration:underline;">'+m.fileName+' ('+Math.round(m.fileSize/1024/1024)+' MB) - Tap to Download</div>';}else if(m.fileName&&m.largeFile&&m.fileData){content='<div class="msg-file" data-large="'+m.id+'" style="color:#00e5ff;cursor:pointer;text-decoration:underline;">'+m.fileName+' ('+Math.round(m.fileSize/1024/1024)+' MB) - Tap to Download</div>';}else if(m.fileName&&m.largeFile){content='<div class="msg-file" style="color:#ffaa44;">'+m.fileName+' ('+Math.round(m.fileSize/1024/1024)+' MB) - Not available</div>';}else if(m.fileName){content='<div class="msg-file">'+m.fileName+'</div>';}else if(m.voiceData){content='<div class="msg-voice"><button class="voice-play-btn" data-voice="'+m.id+'">▶</button><span class="voice-duration">'+(m.voiceDuration||0)+'s</span></div>';}else{content=m.text;}html+='<div class="'+cls+'"><div class="bubble">'+sender+content+'<div class="msg-time">'+(m.time||getTime())+'</div></div></div>';}area.innerHTML=html;area.scrollTop=area.scrollHeight;var fileEls=area.querySelectorAll('.msg-file[data-fid]');for(var fi=0;fi<fileEls.length;fi++){fileEls[fi].addEventListener('click',function(){var fid=parseInt(this.getAttribute('data-fid'));var msg=App.messages.find(function(mm){return mm.id===fid;});if(msg&&msg.fileData){downloadFile(msg.fileData,msg.fileName,msg.fileType||'application/octet-stream');}});}var blobEls=area.querySelectorAll('.msg-file[data-blob]');for(var bi=0;bi<blobEls.length;bi++){blobEls[bi].addEventListener('click',function(){var fid=parseInt(this.getAttribute('data-blob'));var msg=App.messages.find(function(mm){return mm.id===fid;});if(msg&&msg.blobUrl){downloadBlobFile(msg.blobUrl,msg.fileName);}});}var largeEls=area.querySelectorAll('.msg-file[data-large]');for(var li=0;li<largeEls.length;li++){largeEls[li].addEventListener('click',function(){var fid=parseInt(this.getAttribute('data-large'));var msg=App.messages.find(function(mm){return mm.id===fid;});if(msg&&msg.fileData){try{var bin=atob(msg.fileData);var bytes=new Uint8Array(bin.length);for(var b=0;b<bin.length;b++){bytes[b]=bin.charCodeAt(b);}var blob=new Blob([bytes],{type:msg.fileType||'application/octet-stream'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=msg.fileName;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},60000);toast('Downloading: '+msg.fileName);}catch(e){toast('Download failed - file too large');}}});}var voiceEls=area.querySelectorAll('.voice-play-btn[data-voice]');for(var vi=0;vi<voiceEls.length;vi++){voiceEls[vi].addEventListener('click',function(){var fid=parseInt(this.getAttribute('data-voice'));var msg=App.messages.find(function(mm){return mm.id===fid;});if(msg&&msg.voiceData){playVoice(msg.voiceData,msg.audioType||'audio/webm');}});}}
function updateActionButton(){var inp=document.getElementById('chatInput');var btn=document.getElementById('actionButton');if(inp.value.trim().length>0){btn.classList.add('active');}else{btn.classList.remove('active');}}
function goBackToContacts(){document.getElementById('chatScreen').classList.remove('active');document.getElementById('contactsScreen').classList.add('active');document.getElementById('headerBackBtn').style.display='none';document.getElementById('headerTitle').textContent='GLITCH MESH';document.getElementById('fabBtn').classList.add('show');renderContacts();}

function init(){
fixScreenHeight();loadData();FileDB.init().then(function(){console.log('FileDB ready');restoreBlobUrls();}).catch(function(e){console.error('FileDB init failed:',e);});renderContacts();updateUI();
document.getElementById('fabBtn').classList.add('show');
document.getElementById('fabBtn').addEventListener('click',function(){document.getElementById('peerNameInput').value=App.name;openModal('setupModal');});
document.getElementById('connectBtn').addEventListener('click',function(){var ip=document.getElementById('serverIpInput').value.trim();var name=document.getElementById('peerNameInput').value.trim();if(!ip){toast('Enter IP');return;}if(name)App.name=name;connectToMesh(ip);});
document.getElementById('shareIdBtn').addEventListener('click',function(){document.getElementById('displayGlitchId').textContent=App.glitchId;openModal('shareIdModal');});
document.getElementById('copyIdBtn').addEventListener('click',function(){navigator.clipboard.writeText(App.glitchId).then(function(){toast('ID copied');}).catch(function(){var temp=document.createElement('input');temp.value=App.glitchId;document.body.appendChild(temp);temp.select();document.execCommand('copy');document.body.removeChild(temp);toast('ID copied');});});
document.getElementById('addContactBtn').addEventListener('click',function(){openModal('addContactModal');});
document.getElementById('saveContactBtn').addEventListener('click',function(){var glitchId=document.getElementById('contactGlitchIdInput').value.trim().toUpperCase();var name=document.getElementById('contactNameInput').value.trim();if(!glitchId||!name){toast('Enter ID and Name');return;}if(!glitchId.match(/^GM-[A-Z0-9]{4}-[A-Z0-9]{4}$/)){toast('Invalid ID format');return;}var existing=App.contacts.find(function(c){return c.glitchId===glitchId;});if(existing){toast('Contact already exists');return;}App.contacts.push({id:App.contacts.length+1,name:name,glitchId:glitchId,peerId:null,isOnline:false});saveData();renderContacts();closeModal('addContactModal');document.getElementById('contactGlitchIdInput').value='';document.getElementById('contactNameInput').value='';toast('Contact added');});
document.getElementById('actionButton').addEventListener('click',function(){var inp=document.getElementById('chatInput');if(inp.value.trim().length>0){sendMessage();}else{if(App.isRecording){stopRecording();}else{startRecording();}}});
document.getElementById('chatInput').addEventListener('input',updateActionButton);
document.getElementById('chatInput').addEventListener('keypress',function(e){if(e.key==='Enter')sendMessage();});
document.getElementById('headerBackBtn').addEventListener('click',goBackToContacts);
document.getElementById('chatBackBtn').addEventListener('click',goBackToContacts);
document.getElementById('attachBtn').addEventListener('click',function(e){e.stopPropagation();document.getElementById('attachMenu').classList.toggle('show');});
document.addEventListener('click',function(){document.getElementById('attachMenu').classList.remove('show');});
document.getElementById('fileOption').addEventListener('click',function(){document.getElementById('attachMenu').classList.remove('show');openModal('fileModal');});
document.getElementById('voiceOption').addEventListener('click',function(){document.getElementById('attachMenu').classList.remove('show');if(App.isRecording){stopRecording();}else{startRecording();}});
document.getElementById('broadcastOption').addEventListener('click',function(){document.getElementById('attachMenu').classList.remove('show');broadcastMessage();});
document.getElementById('voiceCallBtn').addEventListener('click',function(){CallSystem.startCall('voice');});
document.getElementById('videoCallBtn').addEventListener('click',function(){CallSystem.startCall('video');});
document.getElementById('acceptCallBtn').addEventListener('click',function(){CallSystem.acceptCall();});
document.getElementById('rejectCallBtn').addEventListener('click',function(){CallTones.stop();if(CallSystem.pendingOffer){App.ws.send(JSON.stringify({type:'call_reject',targetPeerId:CallSystem.pendingOffer.from}));}closeModal('callModal');CallSystem.pendingOffer=null;if(CallSystem.peerConnection){CallSystem.peerConnection.close();CallSystem.peerConnection=null;}toast('Call rejected');});
document.getElementById('clearChatBtn').addEventListener('click',clearChat);
document.getElementById('deleteContactBtn').addEventListener('click',deleteContact);
document.getElementById('fileSendBtn').addEventListener('click',sendFile);
document.getElementById('fileInput').addEventListener('change',function(){if(this.files[0]){var f=this.files[0];var st;if(f.size>1024*1024*1024){st=Math.round(f.size/(1024*1024*1024)*10)/10+' GB';}else if(f.size>1024*1024){st=Math.round(f.size/(1024*1024))+' MB';}else{st=Math.round(f.size/1024)+' KB';}document.getElementById('fileLabel').textContent=f.name+' ('+st+')';}});
toast('Your ID: '+App.glitchId);
}
window.onload=init;
</script>
</body>
</html>
